<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Chess where the board itself can turn." />
    <title>Rookabout</title>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud">
      <h1>Rookabout</h1>
      <span id="status"></span>
    </div>
    <div class="players">
      <label class="white"
        >White
        <select id="player-white"></select
      ></label>
      <label class="black"
        >Black
        <select id="player-black"></select
      ></label>
      <label class="mode"
        >Mode
        <select id="game-mode">
          <option value="roundabout">Roundabout</option>
          <option value="normal">Normal</option>
        </select></label
      >
      <label class="set"
        >Set
        <select id="piece-set"></select
      ></label>
    </div>
    <aside id="notation" class="notation">
      <button id="notation-toggle" type="button" class="secondary" aria-controls="notation-body">
        Moves
      </button>
      <div id="notation-body" class="notation-body">
        <ol id="notation-list"></ol>
        <div class="history-steps">
          <button
            id="history-first"
            type="button"
            class="secondary"
            title="To the start (Home)"
            aria-label="To the start"
          >
            ⏮
          </button>
          <button
            id="history-back"
            type="button"
            class="secondary"
            title="Back a move (←)"
            aria-label="Back a move"
          >
            ◀
          </button>
          <button
            id="history-forward"
            type="button"
            class="secondary"
            title="Forward a move (→)"
            aria-label="Forward a move"
          >
            ▶
          </button>
          <button
            id="history-last"
            type="button"
            class="secondary"
            title="To the latest move (End)"
            aria-label="To the latest move"
          >
            ⏭
          </button>
        </div>
        <div class="history-actions">
          <button
            id="history-reset"
            type="button"
            class="secondary"
            title="Drop the moves after this position and play on from here"
          >
            Reset here
          </button>
          <button id="notation-copy" type="button" class="secondary">Copy</button>
        </div>
      </div>
    </aside>
    <div class="controls">
      <div class="band-controls">
        <button id="rotate-ccw" type="button" aria-label="Turn counter-clockwise" hidden>↺</button>
        <span id="band-name"></span>
        <button id="rotate-cw" type="button" aria-label="Turn clockwise" hidden>↻</button>
      </div>
      <p id="band-note" hidden></p>
      <div id="promotion" class="promotion" hidden></div>
      <div class="game-controls">
        <button id="new-game" type="button" class="secondary">New game</button>
        <button id="sound-toggle" type="button" class="secondary"></button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
